<style>
:root{
  --bg:#0d1117; --panel:#151b23; --panel-2:#1c232d; --line:#2b3440;
  --text:#e6edf3; --muted:#8b98a5; --accent:#58a6ff;
  --up:#22d3ee; --down:#fb923c;
  --rise:#ff5c5c; --fall:#2ecc71;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
}
header{display:flex;align-items:center;gap:10px 16px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand h1{margin:0;font-size:18px;letter-spacing:.5px}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
#search{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;width:260px;font-size:14px;outline:none;transition:border-color .2s}
#search:focus{border-color:var(--accent)}
#search.notfound{border-color:#f85149}
.btn{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:600}
#filters{display:flex;gap:6px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line)}
#filters .label{font-size:12px;color:var(--muted);margin-right:4px;flex-shrink:0}
#chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);font-size:12.5px;cursor:pointer;user-select:none;color:var(--text);font-family:inherit;flex-shrink:0}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip.off{opacity:.35}
.chip .n{color:var(--muted);font-size:11px}
.chip .avg{font-size:11px;font-weight:700}
.grp{display:grid;grid-template-columns:10px 1fr 72px 62px;align-items:center;gap:8px;width:100%;background:none;border:0;color:var(--text);padding:6px 6px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px;text-align:left}
.grp:hover{background:var(--panel-2)}
.grp .dot{width:10px;height:10px;border-radius:50%}
.grp .gn .n{color:var(--muted);font-size:11px;margin-left:4px}
.gbar{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.gbar i{display:block;height:100%}
.gv{text-align:right;font-weight:700;font-size:12.5px}
#stats{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;padding-left:10px;text-align:right}
main{flex:1;display:flex;min-height:0}
#graph{flex:1;position:relative;min-width:0}
#graph svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#graph svg:active{cursor:grabbing}
.link{fill:none;stroke:#3d4855;stroke-width:1.3;transition:stroke-opacity .2s}
.link.up{stroke:var(--up);stroke-width:2.2}
.link.down{stroke:var(--down);stroke-width:2.2}
.link.dim{stroke-opacity:.07}
.hit{fill:none;stroke:transparent;stroke-width:12;cursor:help}
.future{fill:none;stroke:#c4b5fd;stroke-width:1.8;pointer-events:stroke;cursor:help;transition:stroke-opacity .2s}
.future.rumor{stroke-dasharray:7 5;stroke-opacity:.9}
.future.ai{stroke-dasharray:2 5;stroke-opacity:.45}
.future.dim{stroke-opacity:.06}
.chip.toggle.on{border-color:#c4b5fd;color:#c4b5fd}
.fut{background:var(--panel-2);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px;line-height:1.5}
.fut .ft{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;margin-right:6px;border:1px solid #c4b5fd;color:#c4b5fd}
.fut .ft.ai{border-style:dashed;opacity:.75}
.fut button{background:none;border:0;color:var(--text);font:inherit;font-weight:600;padding:0;cursor:pointer}
.fut button:hover{color:var(--accent)}
.fut .fr{color:var(--muted);font-size:12px;margin-top:3px}
.fut a{color:var(--accent);font-size:12px}
.node{cursor:pointer;transition:opacity .2s}
.node .ring{stroke:#0d1117;stroke-width:1.5}
.node .face{fill:#fff}
.node .init{font-size:11px;font-weight:700;fill:#1f2937;pointer-events:none}
.node .name{font-size:11px;fill:var(--text);paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:none}
.node .pct{font-size:10px;font-weight:700;paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:none}
.node.dim{opacity:.13}
.node.sel .ring{stroke:#fff;stroke-width:3}
.node.sel .name{font-weight:700;font-size:13px}
.rise{color:var(--rise);fill:var(--rise)}
.fall{color:var(--fall);fill:var(--fall)}
.flat{color:var(--muted);fill:var(--muted)}
#tooltip{position:absolute;pointer-events:none;background:rgba(21,27,35,.97);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.55;opacity:0;transition:opacity .12s;max-width:280px;z-index:5}
#note{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--muted);background:rgba(13,17,23,.75);padding:4px 8px;border-radius:6px;pointer-events:none;max-width:calc(100% - 24px)}
#panel{width:370px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto}
#panel-handle{display:none}
#panel-body{padding:18px}
#panel h2{margin:0;font-size:20px}
#panel h3{font-size:14px;margin:18px 0 8px}
.co-head{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.co-logo{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:4px solid}
.co-logo img{width:26px;height:26px;object-fit:contain}
.co-logo span{font-weight:700;color:#1f2937}
.en{color:var(--muted);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.quote{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
.q-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.q-price{font-size:24px;font-weight:700;letter-spacing:.3px}
.q-chg{font-size:15px;font-weight:700}
.q-meta{font-size:11.5px;color:var(--muted);margin-top:4px}
.desc{font-size:14px;line-height:1.7;color:#c9d1d9;margin:10px 0 4px}
.news{display:block;text-decoration:none;color:var(--text);background:var(--panel-2);border:1px solid transparent;border-radius:8px;padding:9px 11px;margin-bottom:6px;font-size:13.5px;line-height:1.5}
.news:hover{border-color:var(--accent)}
.news .nd{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.actions{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:3px;margin-top:18px}
.seg button{flex:1;background:none;border:0;color:var(--muted);padding:6px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit}
.seg button.on{background:var(--line);color:var(--text);font-weight:600}
.rel-sec h3{display:flex;align-items:center;gap:8px}
.swatch{width:18px;height:3px;border-radius:2px;display:inline-block}
.swatch.up{background:var(--up)}
.swatch.down{background:var(--down)}
.cnt{color:var(--muted);font-weight:400;font-size:12px}
.lv{font-size:11.5px;color:var(--muted);margin:10px 0 6px}
.rel{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;background:var(--panel-2);border:1px solid transparent;color:var(--text);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;font-size:13px;line-height:1.45;font-family:inherit}
.rel:hover{border-color:var(--accent)}
.rel .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0}
.rel .rn{font-weight:600}
.rel .rl{color:var(--muted)}
.rel .rp{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap;padding-left:8px}
.empty{font-size:13px;color:var(--muted);padding:2px 0}
.hint{font-size:12px;color:var(--muted);margin-top:14px}
.muted{color:var(--muted)}
.howto{padding-left:18px;font-size:13.5px;line-height:1.85;color:#c9d1d9;margin:6px 0}
.legend-row{display:flex;align-items:center;gap:10px;font-size:13px;color:#c9d1d9;margin:6px 0}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#fallback{padding:40px;color:var(--muted)}
@media (max-width:760px){
  header{padding:8px 12px}
  .brand h1{font-size:16px}
  .brand p{display:none}
  .tools{margin-left:0;width:100%}
  #search{flex:1;width:auto}
  #filters{padding:6px 12px;overflow-x:auto}
  #chips{flex-wrap:nowrap}
  #stats{display:none}
  #panel{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:62vh;border-left:none;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(calc(100% - 46px));transition:transform .25s ease;z-index:10;box-shadow:0 -8px 24px rgba(0,0,0,.45)}
  #panel.open{transform:none}
  #panel-handle{display:flex;align-items:center;justify-content:space-between;height:46px;padding:0 18px;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);font-weight:600;cursor:pointer;z-index:1}
  #note{display:none}
}
</style>

<script>
/* ====== 程式區 ====== */
(function () {
  const graphEl = document.getElementById("graph");
  if (!window.d3) {
    graphEl.innerHTML = '<p id="fallback">無法載入 D3.js，請確認網路連線後重新整理頁面。</p>';
    return;
  }

  const indMap = Object.fromEntries(INDUSTRIES.map(i => [i.key, i]));
  const TIER_R = { L: 24, M: 18, S: 14 };
  const TIER_NAME = { L: "大型", M: "中型", S: "小型" };
  const MKT_NAME = { TW: "台股", US: "美股", JP: "日股", KR: "韓股" };
  const CUR = { TWD: "NT$", USD: "US$", JPY: "¥", KRW: "₩" };
  const MKT_CUR = { TW: "TWD", US: "USD", JP: "JPY", KR: "KRW" };
  // 產業在供應鏈中的層級：0 最上游 → 5 最下游
  const LAYER = { equip: 0, foundry: 1, memory: 1, osat: 2, comp: 2, optic: 3, ic: 4, odm: 5, brand: 6 };
  const UP_COLOR = "#22d3ee", DOWN_COLOR = "#fb923c";
  const LIVE_DATA = (typeof LIVE !== "undefined" && LIVE) || {};
  const PRICES = LIVE_DATA.prices || {};
  const NEWS = LIVE_DATA.news || {};

  const nodes = COMPANIES.map((d, i) => ({ ...d, label: d.label || d.name, idx: i }));
  const byId = new Map(nodes.map(n => [n.id, n]));
  const links = RELATIONS.map(([s, t, label]) => ({ source: s, target: t, sid: s, tid: t, label }));
  const inAdj = new Map(nodes.map(n => [n.id, []]));
  const outAdj = new Map(nodes.map(n => [n.id, []]));
  links.forEach(l => { outAdj.get(l.sid).push(l); inAdj.get(l.tid).push(l); });
  const hasLink = id => outAdj.get(id).length + inAdj.get(id).length > 0;

  const hidden = new Set();
  let selected = null;
  let depth = 1;
  let mode = null; // "h"：桌機左右排列；"v"：手機上下排列

  /* ---------- 工具函式 ---------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const newsUrl = d => `https://news.google.com/search?q=${encodeURIComponent(d.q + " site:tw.stock.yahoo.com")}&hl=zh-TW&gl=TW&ceid=TW:zh-Hant`;
  const stockUrl = d => d.mkt === "TW"
    ? `https://tw.stock.yahoo.com/quote/${d.yf}`
    : `https://finance.yahoo.com/quote/${encodeURIComponent(d.yf)}`;
  const logoUrl = d => `https://www.google.com/s2/favicons?domain=${d.domain}&sz=128`;
  const trend = p => !p ? "flat" : p.change > 0 ? "rise" : p.change < 0 ? "fall" : "flat";
  const fmt = (n, cur) => {
    const dec = (cur === "JPY" || cur === "KRW") ? 0 : 2;
    return Number(n).toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
  };
  const pctText = p => p ? `${p.pct > 0 ? "+" : ""}${p.pct.toFixed(2)}%` : "";
  const chgText = (p, cur) => {
    if (!p) return "";
    const arrow = p.change > 0 ? "▲" : p.change < 0 ? "▼" : "－";
    return `${arrow} ${fmt(Math.abs(p.change), cur)}（${pctText(p)}）`;
  };
  const fmtDate = s => s ? s.replace(/-/g, "/") : "";

  /* ---------- SVG 與縮放 ---------- */
  const svg = d3.select(graphEl).append("svg");
  const defs = svg.append("defs");
  Object.entries({ arrow: "#56606c", "arrow-up": UP_COLOR, "arrow-down": DOWN_COLOR, "arrow-future": "#c4b5fd" }).forEach(([id, color]) => {
    defs.append("marker").attr("id", id).attr("viewBox", "0 -5 10 10")
      .attr("refX", 10).attr("refY", 0).attr("markerWidth", 8).attr("markerHeight", 8)
      .attr("markerUnits", "userSpaceOnUse").attr("orient", "auto")
      .append("path").attr("d", "M0,-5L10,0L0,5Z").attr("fill", color);
  });

  const root = svg.append("g");
  const linkG = root.append("g");
  const hitG = root.append("g");
  const nodeG = root.append("g");
  const zoom = d3.zoom().scaleExtent([0.2, 4]).on("zoom", e => root.attr("transform", e.transform));
  svg.call(zoom).on("dblclick.zoom", null);

  const linkSel = linkG.selectAll("path").data(links).join("path")
    .attr("class", "link").attr("marker-end", "url(#arrow)");
  const hitSel = hitG.selectAll("path").data(links).join("path").attr("class", "hit");
  // 未來可能關係：不參與排版，只依附在既有節點上
  const futLinks = FUTURE.filter(f => byId.has(f.s) && byId.has(f.t))
    .map(f => ({ ...f, source: byId.get(f.s), target: byId.get(f.t) }));
  const showFuture = { rumor: false, ai: false };
  const futSel = root.insert("g", () => nodeG.node()).selectAll("path").data(futLinks).join("path")
    .attr("class", f => "future " + f.type).attr("marker-end", "url(#arrow-future)").style("display", "none");
  const nodeSel = nodeG.selectAll("g").data(nodes).join("g").attr("class", "node");

  // 節點：外圈＝產業色塊，內圈白底放公司 logo；logo 載入失敗時顯示文字縮寫
  nodeSel.append("circle").attr("class", "ring").attr("r", d => TIER_R[d.tier]).attr("fill", d => indMap[d.ind].color);
  nodeSel.append("circle").attr("class", "face").attr("r", d => TIER_R[d.tier] - 4);
  nodeSel.append("text").attr("class", "init").attr("text-anchor", "middle").attr("dy", "0.35em")
    .text(d => d.label.slice(0, 1));
  nodeSel.filter(d => d.domain).append("image")
    .attr("href", logoUrl)
    .attr("width", d => (TIER_R[d.tier] - 4) * 1.4).attr("height", d => (TIER_R[d.tier] - 4) * 1.4)
    .attr("x", d => -(TIER_R[d.tier] - 4) * 0.7).attr("y", d => -(TIER_R[d.tier] - 4) * 0.7)
    .on("load", function () { d3.select(this.parentNode).select(".init").style("display", "none"); })
    .on("error", function () { d3.select(this).remove(); });
  const labelSel = nodeSel.append("text").attr("text-anchor", "middle").attr("dy", d => TIER_R[d.tier] + 13);
  labelSel.append("tspan").attr("class", "name").text(d => d.label);
  labelSel.append("tspan").attr("x", 0).attr("dy", "1.25em")
    .attr("class", d => "pct " + trend(PRICES[d.id]))
    .text(d => pctText(PRICES[d.id]));

  /* ---------- 力導向模擬：桌機左右分層、手機上下分層 ---------- */
  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(85).strength(0.2))
    .stop();

  function layout() {
    const m = window.innerWidth < 760 ? "v" : "h";
    if (m === mode) return false;
    mode = m;
    const jitter = i => ((i * 37) % 90) - 45; // 固定的初始偏移，讓每次排版結果一致
    if (m === "h") {
      sim.force("x", d3.forceX(d => (LAYER[d.ind] - 3) * 210).strength(0.35))
        .force("y", d3.forceY(0).strength(d => hasLink(d.id) ? 0.07 : 0.4))
        .force("charge", d3.forceManyBody().strength(-380))
        .force("collide", d3.forceCollide().radius(d => TIER_R[d.tier] + 18));
      nodes.forEach(n => { n.x = (LAYER[n.ind] - 3) * 210 + jitter(n.idx); n.y = jitter(n.idx * 7); });
    } else {
      sim.force("x", d3.forceX(0).strength(d => hasLink(d.id) ? 0.2 : 0.45))
        .force("y", d3.forceY(d => (LAYER[d.ind] - 3) * 160).strength(0.5))
        .force("charge", d3.forceManyBody().strength(-170))
        .force("collide", d3.forceCollide().radius(d => TIER_R[d.tier] + 15));
      nodes.forEach(n => { n.x = jitter(n.idx * 7) * 3; n.y = (LAYER[n.ind] - 3) * 160 + jitter(n.idx) * 0.5; });
    }
    sim.alpha(1);
    for (let i = 0; i < 450; i++) sim.tick();
    return true;
  }

  // 連線畫成微彎的二次貝茲曲線；trim 時把起訖點縮到圓圈邊緣，讓箭頭剛好指在圓圈上
  function curve(l, trim) {
    const s = l.source, t = l.target;
    const dx = t.x - s.x, dy = t.y - s.y;
    const dist = Math.hypot(dx, dy) || 1;
    const off = Math.min(dist * 0.12, 42);
    const cx = (s.x + t.x) / 2 - dy / dist * off, cy = (s.y + t.y) / 2 + dx / dist * off;
    if (!trim) return `M${s.x},${s.y}Q${cx},${cy} ${t.x},${t.y}`;
    const unit = (ax, ay, bx, by) => { const d = Math.hypot(bx - ax, by - ay) || 1; return [(bx - ax) / d, (by - ay) / d]; };
    const [ux, uy] = unit(s.x, s.y, cx, cy), [vx, vy] = unit(cx, cy, t.x, t.y);
    const rs = TIER_R[s.tier], rt = TIER_R[t.tier] + 3;
    return `M${s.x + ux * rs},${s.y + uy * rs}Q${cx},${cy} ${t.x - vx * rt},${t.y - vy * rt}`;
  }
  function ticked() {
    linkSel.attr("d", l => curve(l, true));
    hitSel.attr("d", l => curve(l, false));
    futSel.attr("d", f => curve(f, true));
    nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
  }
  layout();
  ticked();
  sim.on("tick", ticked);

  nodeSel.call(d3.drag()
    .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.15).restart(); d.fx = d.x; d.fy = d.y; hideTip(); })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

  /* ---------- 提示框 ---------- */
  const tip = d3.select("#tooltip");
  function showTip(e, html) { tip.html(html).style("opacity", 1); moveTip(e); }
  function moveTip(e) {
    const r = graphEl.getBoundingClientRect();
    const tw = tip.node().offsetWidth, th = tip.node().offsetHeight;
    let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
    if (x + tw > r.width - 8) x = e.clientX - r.left - tw - 14;
    if (y + th > r.height - 8) y = e.clientY - r.top - th - 14;
    tip.style("left", Math.max(4, x) + "px").style("top", Math.max(4, y) + "px");
  }
  function hideTip() { tip.style("opacity", 0); }

  nodeSel
    .on("mouseenter", (e, d) => {
      const p = PRICES[d.id], cur = (p && p.cur) || MKT_CUR[d.mkt];
      const priceLine = p
        ? `<br>${CUR[cur] || ""}${fmt(p.close, cur)} <span class="${trend(p)}">${chgText(p, cur)}</span>`
        : "";
      showTip(e, `<b>${esc(d.name)}</b> <span class="muted">${esc(d.en)}</span><br>` +
        `<span style="color:${indMap[d.ind].color}">●</span> ${indMap[d.ind].name}｜${MKT_NAME[d.mkt]} ${d.ticker}${priceLine}`);
    })
    .on("mousemove", moveTip)
    .on("mouseleave", hideTip)
    .on("click", (e, d) => { e.stopPropagation(); select(d.id, false); });

  hitSel
    .on("mouseenter", (e, l) => showTip(e, `<b>${esc(l.source.name)}</b> → <b>${esc(l.target.name)}</b><br>${esc(l.label)}`))
    .on("mousemove", moveTip)
    .on("mouseleave", hideTip)
    .on("click", e => e.stopPropagation());

  const futTip = f => `<b>${f.type === "rumor" ? "市場傳聞" : "AI 推測"}</b>｜${esc(f.source.name)} → ${esc(f.target.name)}<br>${esc(f.label)}<br>` +
    (f.type === "rumor" ? `<span class="muted">來源：${esc(f.src)}（${fmtDate(f.date)}）</span>` : `<span class="muted">來源：AI 推測，未經證實</span>`);
  futSel.on("mouseenter", (e, f) => showTip(e, futTip(f))).on("mousemove", moveTip).on("mouseleave", hideTip)
    .on("click", (e, f) => { e.stopPropagation(); if (f.url) window.open(f.url, "_blank", "noopener"); });

  svg.on("click", () => clearSel());

  /* ---------- 篩選與統計 ---------- */
  const chipsEl = document.getElementById("chips");
  const statsEl = document.getElementById("stats");
  const noteEl = document.getElementById("note");
  // 族群平均漲跌幅：該產業內有股價資料的公司漲跌幅簡單平均
  const groupAvg = {};
  INDUSTRIES.forEach(ind => {
    const v = nodes.filter(n => n.ind === ind.key && PRICES[n.id]).map(n => PRICES[n.id].pct);
    groupAvg[ind.key] = v.length ? { pct: v.reduce((a, b) => a + b, 0) / v.length, n: v.length, change: 0 } : null;
    if (groupAvg[ind.key]) groupAvg[ind.key].change = groupAvg[ind.key].pct;
  });
  INDUSTRIES.forEach(ind => {
    const count = nodes.filter(n => n.ind === ind.key).length;
    const g = groupAvg[ind.key];
    const b = document.createElement("button");
    b.className = "chip"; b.dataset.key = ind.key; b.title = "點擊切換顯示／隱藏";
    b.innerHTML = `<span class="dot" style="background:${ind.color}"></span>${ind.name}<span class="n">${count}</span>` +
      (g ? `<span class="avg ${trend(g)}">${pctText(g)}</span>` : "");
    if (g) b.title = `點擊切換顯示／隱藏｜族群平均漲跌 ${pctText(g)}（${g.n} 家平均）`;
    b.onclick = () => { hidden.has(ind.key) ? hidden.delete(ind.key) : hidden.add(ind.key); applyFilter(); };
    chipsEl.appendChild(b);
  });
  const allBtn = document.createElement("button");
  allBtn.className = "chip"; allBtn.textContent = "全部顯示";
  allBtn.onclick = () => { hidden.clear(); applyFilter(); fitView(true); };
  chipsEl.appendChild(allBtn);
  const noneBtn = document.createElement("button");
  noneBtn.className = "chip"; noneBtn.textContent = "全部隱藏";
  noneBtn.onclick = () => { INDUSTRIES.forEach(i => hidden.add(i.key)); applyFilter(); };
  chipsEl.appendChild(noneBtn);
  [["rumor", "－ － 市場傳聞"], ["ai", "· · · AI 推測"]].forEach(([key, text]) => {
    const b = document.createElement("button");
    b.className = "chip toggle"; b.textContent = text;
    b.title = key === "rumor" ? "顯示媒體報導的未來可能關係（附來源，未經公司證實）" : "顯示 AI 依產業邏輯推測的可能關係（無外部來源）";
    b.onclick = () => { showFuture[key] = !showFuture[key]; b.classList.toggle("on", showFuture[key]); applyFilter(); };
    chipsEl.appendChild(b);
  });

  const updated = LIVE_DATA.updated || "";
  noteEl.textContent = (updated ? `股價與新聞更新於 ${fmtDate(updated)}（台灣時間）｜` : "股價與新聞每日自動更新｜") +
    "紅漲綠跌｜關係依公開資訊整理，僅供學習參考，非投資建議";

  const linkVisible = l => !hidden.has(l.source.ind) && !hidden.has(l.target.ind);

  function applyFilter() {
    chipsEl.querySelectorAll(".chip[data-key]").forEach(c => c.classList.toggle("off", hidden.has(c.dataset.key)));
    nodeSel.style("display", d => hidden.has(d.ind) ? "none" : null);
    linkSel.style("display", l => linkVisible(l) ? null : "none");
    hitSel.style("display", l => linkVisible(l) ? null : "none");
    futSel.style("display", f => showFuture[f.type] && linkVisible(f) ? null : "none");
    if (selected && hidden.has(selected.ind)) clearSel(); else applyHighlight();
    const n = nodes.filter(d => !hidden.has(d.ind)).length;
    const m = links.filter(linkVisible).length;
    statsEl.textContent = `顯示 ${n} 家公司 · ${m} 條供應關係`;
  }

  /* ---------- 上下游追溯 ---------- */
  function traverse(startId, adj, dir, maxDepth) {
    const level = new Map(), linkSet = new Set();
    let frontier = [startId];
    for (let d = 1; d <= maxDepth; d++) {
      const next = [];
      for (const id of frontier) {
        for (const l of adj.get(id)) {
          if (!linkVisible(l)) continue;
          const other = dir === "up" ? l.sid : l.tid;
          if (other === startId) continue;
          linkSet.add(l);
          if (!level.has(other)) { level.set(other, d); next.push(other); }
        }
      }
      frontier = next;
    }
    return { level, linkSet };
  }

  function applyHighlight() {
    if (!selected) {
      nodeSel.classed("dim", false).classed("sel", false);
      linkSel.classed("dim", false).classed("up", false).classed("down", false).attr("marker-end", "url(#arrow)");
      futSel.classed("dim", false);
      return;
    }
    const up = traverse(selected.id, inAdj, "up", depth);
    const down = traverse(selected.id, outAdj, "down", depth);
    const active = new Set([selected.id, ...up.level.keys(), ...down.level.keys()]);
    futLinks.forEach(f => {
      if (showFuture[f.type] && linkVisible(f) && (f.s === selected.id || f.t === selected.id)) { active.add(f.s); active.add(f.t); }
    });
    nodeSel.classed("dim", d => !active.has(d.id)).classed("sel", d => d.id === selected.id);
    linkSel
      .classed("up", l => up.linkSet.has(l))
      .classed("down", l => !up.linkSet.has(l) && down.linkSet.has(l))
      .classed("dim", l => !up.linkSet.has(l) && !down.linkSet.has(l))
      .attr("marker-end", l => up.linkSet.has(l) ? "url(#arrow-up)" : down.linkSet.has(l) ? "url(#arrow-down)" : "url(#arrow)");
    futSel.classed("dim", f => f.s !== selected.id && f.t !== selected.id);
    nodeSel.filter(d => d.id === selected.id).raise();
    renderCompany(up, down);
  }

  /* ---------- 資訊面板 ---------- */
  const panel = document.getElementById("panel");
  const panelBody = document.getElementById("panel-body");
  const handleTitle = document.getElementById("handle-title");
  const handleArrow = document.getElementById("handle-arrow");
  document.getElementById("panel-handle").onclick = () => setPanelOpen(!panel.classList.contains("open"));
  function setPanelOpen(open) {
    panel.classList.toggle("open", open);
    handleArrow.textContent = open ? "▼" : "▲";
  }

  function relButton(target, html, label) {
    const p = PRICES[target.id];
    return `<button class="rel" data-id="${target.id}">
      <span class="dot" style="background:${indMap[target.ind].color}"></span>
      <span><span class="rn">${html}</span><br><span class="rl">${esc(label)}</span></span>
      ${p ? `<span class="rp ${trend(p)}">${pctText(p)}</span>` : ""}</button>`;
  }

  function relList(res, dir) {
    const direct = [], second = [];
    res.linkSet.forEach(l => {
      const isDirect = dir === "up" ? l.tid === selected.id : l.sid === selected.id;
      (isDirect ? direct : second).push(l);
    });
    let html = "";
    if (!direct.length) html += `<div class="empty">（圖中沒有已知的${dir === "up" ? "上游供應商" : "下游客戶"}：可能未公開，或不在本圖範圍內）</div>`;
    direct.forEach(l => {
      const other = dir === "up" ? l.source : l.target;
      html += relButton(other, esc(other.name), l.label);
    });
    if (depth === 2 && second.length) {
      html += `<div class="lv">第 2 層</div>`;
      second.forEach(l => {
        const far = dir === "up" ? l.source : l.target;
        html += relButton(far, `${esc(l.source.name)} → ${esc(l.target.name)}`, l.label);
      });
    }
    return { html, count: direct.length };
  }

  function quoteHtml(d) {
    const p = PRICES[d.id];
    if (!p) return `<div class="quote"><div class="q-meta">股價資料尚未更新（每個交易日自動更新）</div></div>`;
    const cur = p.cur || MKT_CUR[d.mkt];
    return `<div class="quote">
      <div class="q-row">
        <span class="q-price">${CUR[cur] || ""}${fmt(p.close, cur)}</span>
        <span class="q-chg ${trend(p)}">${chgText(p, cur)}</span>
      </div>
      <div class="q-meta">${fmtDate(p.date)} 收盤／最新價 · 與前一交易日比較 · 來源：${esc(p.src || "")}</div>
    </div>`;
  }

  function newsHtml(d) {
    const list = NEWS[d.id] || [];
    if (!list.length) return `<div class="empty">目前沒有近期新聞資料（每日自動更新）</div>`;
    return list.map(n => `<a class="news" href="${esc(n.link)}" target="_blank" rel="noopener">
      ${esc(n.title)}<span class="nd">${fmtDate(n.time)} · Yahoo股市</span></a>`).join("");
  }

  function logoHtml(d) {
    const c = indMap[d.ind].color;
    return `<div class="co-logo" style="border-color:${c}">
      ${d.domain ? `<img src="${logoUrl(d)}" alt="" onerror="this.outerHTML='<span>${esc(d.label.slice(0, 1))}</span>'">` : `<span>${esc(d.label.slice(0, 1))}</span>`}</div>`;
  }

  function renderCompany(up, down) {
    const d = selected, ind = indMap[d.ind];
    const upL = relList(up, "up"), downL = relList(down, "down");
    handleTitle.textContent = d.name;
    panelBody.innerHTML = `
      <div class="co-head">
        ${logoHtml(d)}
        <div><h2>${esc(d.name)}</h2><div class="en">${esc(d.en)}</div></div>
      </div>
      <div class="tags">
        <span class="tag">${ind.name}</span>
        <span class="tag">${MKT_NAME[d.mkt]} ${d.ticker}</span>
        <span class="tag">規模：${TIER_NAME[d.tier]}</span>
      </div>
      ${quoteHtml(d)}
      <p class="desc">${esc(d.desc)}</p>
      <h3>最新新聞</h3>
      ${newsHtml(d)}
      <div class="actions">
        <a class="btn primary" href="${newsUrl(d)}" target="_blank" rel="noopener">📰 更多新聞</a>
        <a class="btn" href="${stockUrl(d)}" target="_blank" rel="noopener">📈 股價走勢</a>
      </div>
      <div class="seg">
        <button data-depth="1" class="${depth === 1 ? "on" : ""}">直接關係</button>
        <button data-depth="2" class="${depth === 2 ? "on" : ""}">兩層關係</button>
      </div>
      <section class="rel-sec">
        <h3><span class="swatch up"></span>上游供應商 <span class="cnt">直接 ${upL.count} 家</span></h3>
        ${upL.html}
      </section>
      <section class="rel-sec">
        <h3><span class="swatch down"></span>下游客戶 <span class="cnt">直接 ${downL.count} 家</span></h3>
        ${downL.html}
      </section>
      ${futureHtml(d)}
      <p class="hint">點選清單中的公司可跳轉；點選圖中空白處或按 Esc 取消選取。</p>`;
    panelBody.querySelectorAll(".fut button").forEach(b => {
      b.onclick = () => select(b.dataset.id, true);
    });
    panelBody.querySelectorAll(".seg button").forEach(b => {
      b.onclick = () => { depth = +b.dataset.depth; applyHighlight(); };
    });
    panelBody.querySelectorAll(".rel").forEach(b => {
      b.onclick = () => select(b.dataset.id, true);
    });
  }

  function futureHtml(d) {
    const list = futLinks.filter(f => f.s === d.id || f.t === d.id)
      .sort((a, b) => (a.type === b.type ? 0 : a.type === "rumor" ? -1 : 1));
    if (!list.length) return "";
    return `<section class="rel-sec"><h3><span class="swatch" style="background:repeating-linear-gradient(90deg,#c4b5fd 0 5px,transparent 5px 8px)"></span>未來可能關係 <span class="cnt">未經公司證實</span></h3>` +
      list.map(f => {
        const other = f.s === d.id ? f.target : f.source;
        const dir = f.s === d.id ? "可能客戶" : "可能供應商";
        const srcLine = f.type === "rumor"
          ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">來源：${esc(f.src)}（${fmtDate(f.date)}）↗</a>`
          : `<div class="fr">來源：AI 推測。${esc(f.reason)}</div>`;
        return `<div class="fut"><span class="ft ${f.type}">${f.type === "rumor" ? "傳聞" : "AI 推測"}</span>${dir}：
          <button data-id="${other.id}">${esc(other.name)}</button><div class="fr">${esc(f.label)}</div>${srcLine}</div>`;
      }).join("") + `</section>`;
  }

  function renderIntro() {
    handleTitle.textContent = "使用說明";
    panelBody.innerHTML = `
      <h2>AI 供應鏈怎麼看？</h2>
      <p class="desc">這張圖整理了 ${nodes.length} 家台灣與國際 AI／半導體公司之間的 ${links.length} 條供應關係，
      ${mode === "v" ? "由上（上游設備、材料）到下" : "由左（上游設備、材料）到右"}（下游品牌與雲端業者）排列。
      每家公司都附上每日股價漲跌與近期新聞。</p>
      <h3>族群平均漲跌 <span class="cnt">點選只看該族群</span></h3>
      ${groupHtml()}
      <h3>操作方式</h3>
      <ul class="howto">
        <li>點選公司：查看股價、新聞、上下游</li>
        <li>拖曳公司：調整位置；滾輪或雙指：縮放、平移</li>
        <li>滑鼠移到連線上：查看供應內容</li>
        <li>上方產業按鈕：篩選要顯示的產業</li>
        <li>搜尋框：輸入公司名稱或股票代號</li>
      </ul>
      <h3>圖例</h3>
      <div class="legend-row">
        <svg width="84" height="44" aria-hidden="true">
          <circle cx="22" cy="22" r="21" fill="#8b98a5"/><circle cx="22" cy="22" r="17" fill="#fff"/>
          <circle cx="54" cy="27" r="15" fill="#8b98a5"/><circle cx="54" cy="27" r="11" fill="#fff"/>
          <circle cx="76" cy="31" r="8" fill="#8b98a5"/><circle cx="76" cy="31" r="4.5" fill="#fff"/>
        </svg>
        外圈顏色＝產業；大小＝市值規模（示意）
      </div>
      <div class="legend-row"><span class="rise">+1.23%</span><span class="fall">−1.23%</span>當日漲跌（紅漲綠跌）</div>
      <div class="legend-row"><span class="swatch up"></span>選取後：上游供應關係</div>
      <div class="legend-row"><span class="swatch down"></span>選取後：下游客戶關係</div>
      <div class="legend-row"><svg width="18" height="6"><line x1="0" y1="3" x2="18" y2="3" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="7 5"/></svg>市場傳聞（附報導來源）</div>
      <div class="legend-row"><svg width="18" height="6"><line x1="0" y1="3" x2="18" y2="3" stroke="#c4b5fd" stroke-opacity=".5" stroke-width="2" stroke-dasharray="2 5"/></svg>AI 推測（無外部來源）</div>
      <div class="quick">
        <button class="btn primary" data-pick="tsmc">從台積電開始 →</button>
        <button class="btn" data-pick="nvda">看 NVIDIA</button>
      </div>
      <p class="hint">${esc(noteEl.textContent)}</p>`;
    panelBody.querySelectorAll("[data-pick]").forEach(b => {
      b.onclick = () => select(b.dataset.pick, true);
    });
    panelBody.querySelectorAll(".grp").forEach(b => {
      b.onclick = () => {
        hidden.clear();
        INDUSTRIES.forEach(i => { if (i.key !== b.dataset.ind) hidden.add(i.key); });
        applyFilter();
        fitView(true);
      };
    });
  }

  function groupHtml() {
    const rows = INDUSTRIES.filter(i => groupAvg[i.key]).sort((a, b) => groupAvg[b.key].pct - groupAvg[a.key].pct);
    if (!rows.length) return `<div class="empty">股價資料更新後顯示</div>`;
    const max = Math.max(...rows.map(i => Math.abs(groupAvg[i.key].pct)), 0.01);
    return rows.map(i => {
      const g = groupAvg[i.key], t = trend(g);
      const color = t === "rise" ? "var(--rise)" : t === "fall" ? "var(--fall)" : "var(--muted)";
      return `<button class="grp" data-ind="${i.key}" title="${g.n} 家公司漲跌幅平均">
        <span class="dot" style="background:${i.color}"></span>
        <span class="gn">${i.name}<span class="n">${g.n} 家</span></span>
        <span class="gbar"><i style="width:${Math.abs(g.pct) / max * 100}%;background:${color}"></i></span>
        <span class="gv ${t}">${pctText(g)}</span></button>`;
    }).join("");
  }

  function select(id, center) {
    const d = byId.get(id);
    if (!d) return;
    if (hidden.has(d.ind)) { hidden.delete(d.ind); applyFilter(); }
    selected = d;
    applyHighlight();
    panel.scrollTop = 0;
    setPanelOpen(true);
    if (center) centerOn(d);
  }

  function centerOn(d) {
    const { width, height } = svg.node().getBoundingClientRect();
    // 手機版面板會蓋住下半部，所以把公司移到畫面上方
    const p = mode === "v" ? [width / 2, height * 0.2] : [width / 2, height / 2];
    svg.transition().duration(600).call(zoom.translateTo, d.x, d.y, p);
  }

  function clearSel() {
    if (!selected) return;
    selected = null;
    applyHighlight();
    renderIntro();
  }

  /* ---------- 搜尋 ---------- */
  const searchEl = document.getElementById("search");
  const dl = document.getElementById("co-list");
  nodes.forEach(n => {
    const o = document.createElement("option");
    o.value = `${n.name}（${n.ticker}）`;
    if (n.en !== n.name) o.label = n.en;
    dl.appendChild(o);
  });
  function doSearch() {
    const raw = searchEl.value.trim();
    if (!raw) return;
    const paren = raw.match(/[（(]([^）)]+)[）)]/);
    const core = raw.replace(/[（(].*$/, "").trim().toLowerCase();
    const fields = n => [n.name, n.label, n.en, n.ticker, n.id].map(s => s.toLowerCase());
    let hit = paren && nodes.find(n => n.ticker === paren[1]);
    if (!hit) hit = nodes.find(n => fields(n).some(s => s === core));
    if (!hit && core) hit = nodes.find(n => fields(n).some(s => s.includes(core)));
    if (hit) {
      select(hit.id, true);
      searchEl.blur();
    } else {
      searchEl.classList.add("notfound");
      setTimeout(() => searchEl.classList.remove("notfound"), 1200);
    }
  }
  searchEl.addEventListener("change", doSearch);
  searchEl.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

  /* ---------- 視圖 ---------- */
  function fitView(animate) {
    const vis = nodes.filter(n => !hidden.has(n.ind));
    if (!vis.length) return;
    const pad = 46;
    const x0 = d3.min(vis, n => n.x) - pad, x1 = d3.max(vis, n => n.x) + pad;
    const y0 = d3.min(vis, n => n.y) - pad, y1 = d3.max(vis, n => n.y) + pad + 24;
    const { width, height } = svg.node().getBoundingClientRect();
    let t;
    if (mode === "v") {
      // 手機：以寬度為準放大，由上往下滑動瀏覽
      const k = Math.min(width / (x1 - x0), 1.3);
      const fitsAll = (y1 - y0) * k <= height;
      t = d3.zoomIdentity.translate(width / 2, fitsAll ? height / 2 : 8).scale(k)
        .translate(-(x0 + x1) / 2, fitsAll ? -(y0 + y1) / 2 : -y0);
    } else {
      const k = Math.min(width / (x1 - x0), height / (y1 - y0), 1.6);
      t = d3.zoomIdentity.translate(width / 2, height / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
    }
    (animate ? svg.transition().duration(600) : svg).call(zoom.transform, t);
  }

  document.getElementById("reset").onclick = () => {
    hidden.clear();
    applyFilter();
    clearSel();
    searchEl.value = "";
    fitView(true);
  };
  document.addEventListener("keydown", e => { if (e.key === "Escape") clearSel(); });

  // 視窗大小跨過手機／桌機分界時重新排版
  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (layout()) {
        ticked();
        if (selected) applyHighlight(); else renderIntro();
        fitView(false);
      }
    }, 200);
  });

  applyFilter();
  renderIntro();
  fitView(false);
})();
</script>
</body>
</html>
